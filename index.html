<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales Management System</title>
    <script>
      (function() {
        try {
          var saved = JSON.parse(localStorage.getItem('gym_sms_config') || '{}');
          var name = saved.dashboardName || saved.companyName;
          if (name) {
            document.title = name + ' | Sales Management';
          }
          if (saved.appFavicon) {
            var iconLink = document.querySelector("link[rel~='icon']");
            if (iconLink) iconLink.href = saved.appFavicon;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
