<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111a2e" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6f8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Seynex Enterprises | Sales Management System</title>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('gym_theme');
          if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
          var saved = JSON.parse(localStorage.getItem('gym_sms_config') || '{}');
          var name = saved.dashboardName || saved.companyName || 'Seynex Enterprises';
          if (name) {
            document.title = name + ' | Sales Management System';
          }
          if (saved.appFavicon) {
            var iconLink = document.querySelector("link[rel~='icon']");
            if (iconLink) iconLink.href = saved.appFavicon;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
